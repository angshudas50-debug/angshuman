<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rumi ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    text-align: center;
    color: white;
}

.container {
    width: 90%;
    max-width: 350px;
}

/* Image */
.photo {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    margin: auto;
    border: 5px solid white;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Buttons */
.btn {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
}

#yesBtn {
    background: #fff;
    color: #ff4d6d;
}

#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
}

/* Kiss animation */
.kiss {
    position: absolute;
    font-size: 28px;
    animation: float 3s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-100vh); }
}
</style>
</head>

<body>

<div class="container">

    <div class="photo">
        <img src="rumi.jpg" alt="Rumi">
    </div>

    <h2>For Rumi ❤️</h2>
    <p>Will you stay with me forever?</p>

    <button id="yesBtn" class="btn" onclick="yesClicked()">Yes ❤️</button>
    <button id="noBtn" class="btn">No 💔</button>

</div>

<script>
const noBtn = document.getElementById("noBtn");

// Make NO button run inside screen
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// YES clicked → emojis
function yesClicked() {
    setInterval(() => {
        const kiss = document.createElement("div");
        kiss.innerHTML = "😘";
        kiss.classList.add("kiss");

        kiss.style.left = Math.random() * 100 + "vw";
        kiss.style.top = "100vh";

        document.body.appendChild(kiss);

        setTimeout(() => kiss.remove(), 3000);
    }, 200);
}
</script>

</body>
</html>
